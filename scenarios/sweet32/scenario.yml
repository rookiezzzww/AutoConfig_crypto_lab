id: sweet32
name: Sweet32
cve: CVE-2016-2183
description: 3DES (64-bit block cipher) TLS teaching endpoint for Sweet32.
category: [TLS, 3DES, Birthday Attack]
runtime:
  image: crypto-lab/sweet32:1.0
  containerName: crypto-sweet32
  containerPort: 8443
  protocol: tcp
  backend: sweet32
switch:
  mode: ondemand
healthCheck:
  type: tcp
  port: 8443
verification:
  type: tls
vulnerabilityOptions:
  - key: cipherSuite
    name: TLS 密码套件
    description: DES-CBC3-SHA 使用 64 位分组密码并满足 Sweet32 条件；AES128-SHA 用作对照配置。
    type: enum
    envVar: SWEET32_CIPHER
    defaultValue: DES-CBC3-SHA
    vulnerableValue: DES-CBC3-SHA
    allowedValues: [DES-CBC3-SHA, AES128-SHA]
    sensitive: false
    restartRequired: true
enabled: true
