id: poodle
name: POODLE
cve: CVE-2014-3566
description: SSLv3 padding-oracle teaching endpoint using a historical OpenSSL server.
category: [TLS, SSLv3, Padding Oracle]
runtime:
  image: crypto-lab/poodle:1.0
  containerName: crypto-poodle
  containerPort: 8443
  protocol: tcp
  backend: poodle
switch:
  mode: prewarmed
healthCheck:
  type: tcp
  port: 8443
verification:
  type: tls
vulnerabilityOptions:
  - key: protocol
    name: SSL/TLS 协议
    description: ssl3 满足 POODLE 的密码误用条件；tls1 可作为关闭该条件的对照配置。
    type: enum
    envVar: POODLE_PROTOCOL
    defaultValue: ssl3
    vulnerableValue: ssl3
    allowedValues: [ssl3, tls1]
    sensitive: false
    restartRequired: true
enabled: true
