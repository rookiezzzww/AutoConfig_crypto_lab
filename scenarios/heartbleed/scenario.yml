id: heartbleed
name: Heartbleed
cve: CVE-2014-0160
description: OpenSSL Heartbeat extension information-disclosure vulnerability (OpenSSL 1.0.1f).
category: [TLS, OpenSSL, Information Disclosure]
runtime:
  image: crypto-lab/heartbleed:1.0
  containerName: crypto-heartbleed
  containerPort: 8443
  protocol: tcp
  backend: heartbleed
switch:
  mode: ondemand
healthCheck:
  type: tcp
  port: 8443
verification:
  type: tls
vulnerabilityOptions:
  - key: tlsProfile
    name: TLS 协议版本
    description: Heartbeat 扩展运行所使用的 TLS 版本；三个候选版本均用于研究 OpenSSL 1.0.1f 的 Heartbleed 条件。
    type: enum
    envVar: HEARTBLEED_TLS_PROFILE
    defaultValue: tls1_2
    vulnerableValues: [tls1, tls1_1, tls1_2]
    allowedValues: [tls1, tls1_1, tls1_2]
    sensitive: false
    restartRequired: true
enabled: true
