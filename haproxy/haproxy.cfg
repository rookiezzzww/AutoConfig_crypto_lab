global
    # The shared named volume is intentionally available only to HAProxy and the control plane.
    # The named Docker volume is root-owned; only HAProxy and the root control plane share it.
    user root
    group root
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    option tcp-check

frontend crypto_tls
    bind *:8443
    default_backend crypto_scenarios

backend crypto_scenarios
    mode tcp
    option tcp-check
    server heartbleed heartbleed:8443 check
    server poodle poodle:8443 check disabled
    server sweet32 sweet32:8443 check disabled
